services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knesset_nest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knesset_nest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DJANGO_SECRET_KEY: change-this-in-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@db:5432/knesset_nest
      REDIS_URL: redis://redis:6379/0
      SECURE_COOKIES: "False"
    ports: ["5000:5000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:5000 --workers 3 --threads 2 --timeout 60 --access-logfile -"

volumes:
  postgres_data:
  redis_data:
